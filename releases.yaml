- {version: "0.2.0", date: 2026-09-28, flow: main, build: prod, note: "first public release. BREAKING: forms, workflows and views move into formsPlugin({toRecord, list, workflows, views}) under config.plugins; views are at <root>/forms/views/<id> (was <root>?view=<id>). New: a plugin router - Worker-shaped fetch(request, env, ctx, admin) handlers mounted at one path segment, plus dashboard/health/flags hooks. Security: Fetch Metadata refuses non-navigation requests; plugins never see the admin cookies and cannot set them; plugin responses are forced no-store/nosniff/DENY; the same database work for every address typed in (no allowlist timing leak); rate limits keyed by hash; 10 codes and 20 wrong codes per address per day; Turnstile tokens must match the hostname"}
