- {version: "0.3.0", date: 2026-10-05, flow: main, build: prod, note: "submission and active: an event may carry an RFC 7396 merge patch (new ADMIN_DB migration 0004, applied by the consumer's usual migrate step); every reader gets the ACTIVE record, the submission with every patch applied, with record.submission (frozen) and record.edited. FORM_DB is still never written. Views mark edited cells; the record page shows submitted values, both records as JSON, and each patch's changes in History; per-form listings now read active records too. A workflow page may return scripts, allowed by sha256 in that page's CSP only. Exports the patch helpers. BEHAVIOUR CHANGE, no edit needed: records given to views, templates and run() are active, with two new keys (submission, edited). Sessions: defaults now 18 h absolute (was 8 h) and 3 h idle (was 1 h); optional vars ADMIN_SESSION_TTL_S / ADMIN_SESSION_IDLE_S override them"}
- {version: "0.2.0", date: 2026-09-28, flow: main, build: prod, note: "first public release. BREAKING: forms, workflows and views move into formsPlugin({toRecord, list, workflows, views}) under config.plugins; views are at <root>/forms/views/<id> (was <root>?view=<id>). New: a plugin router - Worker-shaped fetch(request, env, ctx, admin) handlers mounted at one path segment, plus dashboard/health/flags hooks. Security: Fetch Metadata refuses non-navigation requests; plugins never see the admin cookies and cannot set them; plugin responses are forced no-store/nosniff/DENY; the same database work for every address typed in (no allowlist timing leak); rate limits keyed by hash; 10 codes and 20 wrong codes per address per day; Turnstile tokens must match the hostname"}
- {version: "0.1.0", date: 2026-09-27, flow: main, build: prod, note: "developed inside its first consumer site, not released"}
